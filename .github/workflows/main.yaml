name: CI

on:
  push:
    branches: [2.x]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
      - run: composer install
      - run: composer lint
      - run: composer unit

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
      - run: composer install
      - run: composer cs

  functional:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
      - name: Install Terminus
        run: |
          mkdir -p ~/terminus && cd ~/terminus
          curl -L https://github.com/pantheon-systems/terminus/releases/latest/download/terminus.phar -o terminus
          chmod +x terminus
          echo "$HOME/terminus" >> "$GITHUB_PATH"
      # Uncomment to authenticate Terminus before tests, e.g. if your
      # plugin tests interact with a Pantheon fixture site.
      # - name: Authenticate Terminus
      #   run: terminus auth:login -n --machine-token="$TERMINUS_TOKEN"
      - run: composer install
      - run: composer install-tools
      - name: Install plugin
        run: terminus self:plugin:install ${{ github.workspace }}
      - run: composer functional
